<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅思口语小助手 | Cosmic Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 宇宙星空主题色 */
            --bg-deep-space: #030408;
            --nebula-purple: rgba(139, 92, 246, 0.12);
            --nebula-cyan: rgba(6, 182, 212, 0.12);
            --starlight: #e2e8f0;
            --starlight-dim: #94a3b8;
            --accent-glow: #06b6d4;
            --accent-purple: #8b5cf6;
            --card-glass: rgba(15, 17, 26, 0.5);
            --border-glass: rgba(255, 255, 255, 0.08);
            --success: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep-space);
            background-image: 
                radial-gradient(circle at 15% 50%, var(--nebula-purple), transparent 40%),
                radial-gradient(circle at 85% 30%, var(--nebula-cyan), transparent 40%);
            color: var(--starlight);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 静态星空背景层 */
        .stars-bg {
            position: fixed; inset: 0; z-index: -1;
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.7), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 160px 120px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.15;
        }

        /* --- 侧边栏 --- */
        .sidebar {
            width: 300px;
            background: rgba(3, 4, 8, 0.7);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            padding: 40px 25px;
            box-sizing: border-box;
            z-index: 10;
        }

        .brand h1 { font-size: 20px; margin: 0; letter-spacing: 1px; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.3); }
        .brand p { font-size: 11px; color: var(--starlight-dim); margin: 8px 0 35px 0; line-height: 1.4; letter-spacing: 0.5px; }

        .nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent-glow); margin-bottom: 12px; font-weight: 600; opacity: 0.8; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .stat-box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px; border: 1px solid var(--border-glass); text-align: center; }
        .stat-val { font-size: 20px; font-weight: 600; color: #fff; display: block; text-shadow: 0 0 10px var(--nebula-purple); }
        .stat-lab { font-size: 10px; color: var(--starlight-dim); margin-top: 5px; }

        /* 强化的随机抽题按钮 */
        .btn-random-big {
            width: 100%;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.2));
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: #fff;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-random-big:hover { background: linear-gradient(135deg, rgba(139, 92, 246, 0.4), rgba(6, 182, 212, 0.4)); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6, 182, 212, 0.2); }

        select { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); color: #fff; border-radius: 6px; font-size: 14px; outline: none; cursor: pointer; margin-bottom: 30px; }

        .btn-ghost { width: 100%; text-align: left; background: transparent; border: 1px solid transparent; color: var(--starlight); padding: 12px 10px; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; border-radius: 6px; margin-bottom: 5px; }
        .btn-ghost i { width: 22px; color: var(--accent-glow); margin-right: 8px; font-size: 15px; }
        .btn-ghost:hover { background: rgba(255,255,255,0.05); color: #fff; }

        /* --- 主内容区 --- */
        .main-stage { flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding: 60px 40px; overflow-y: auto; }
        .practice-area { max-width: 800px; width: 100%; }

        .chinese-prompt { font-size: 24px; font-weight: 400; line-height: 1.6; margin-bottom: 40px; color: #fff; text-align: center; }

        textarea { width: 100%; height: 140px; background: rgba(0,0,0,0.2); border: 1px solid var(--border-glass); border-radius: 12px; color: var(--starlight); font-size: 17px; font-family: inherit; resize: none; padding: 20px; margin-bottom: 25px; transition: all 0.3s; box-shadow: inset 0 4px 10px rgba(0,0,0,0.5); }
        textarea:focus { outline: none; border-color: var(--accent-glow); box-shadow: inset 0 4px 10px rgba(0,0,0,0.5), 0 0 15px rgba(6, 182, 212, 0.1); }

        .btn-main { background: #fff; color: #000; border: none; padding: 15px 45px; border-radius: 30px; font-size: 15px; font-weight: 600; cursor: pointer; display: block; margin: 0 auto; transition: 0.3s; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .btn-main:hover { transform: scale(1.03); box-shadow: 0 0 30px rgba(255,255,255,0.4); }

        /* --- 答案解析：毛玻璃质感 --- */
        .analysis-view { display: none; margin-top: 50px; animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .ref-card { background: var(--card-glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border-glass); padding: 45px; border-radius: 16px; position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }

        .ref-label { font-size: 11px; color: var(--accent-glow); letter-spacing: 2px; margin-bottom: 25px; font-weight: 600; }

        .english-text { font-family: 'Libre Baskerville', serif; font-size: 24px; line-height: 1.6; color: #fff; margin-bottom: 35px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        .target-tags { font-size: 14px; color: var(--accent-glow); background: rgba(6, 182, 212, 0.05); border: 1px solid rgba(6, 182, 212, 0.2); padding: 12px 18px; border-radius: 8px; margin-bottom: 35px; }

        .insight-list { list-style: none; padding: 0; }
        .insight-list li { font-size: 15px; color: var(--starlight-dim); margin-bottom: 20px; line-height: 1.6; padding-left: 20px; position: relative; }
        .insight-list li::before { content: '✦'; position: absolute; left: 0; color: var(--accent-purple); font-size: 12px; top: 3px; }
        .insight-list li b { color: #fff; font-weight: 600; }

        /* 修复后的整题收藏星标 */
        .favorite-btn { position: absolute; top: 40px; right: 40px; cursor: pointer; font-size: 22px; color: rgba(255,255,255,0.2); transition: 0.3s; }
        .favorite-btn:hover { color: #fff; transform: scale(1.1); }
        .favorite-btn.active { color: #fbbf24; text-shadow: 0 0 15px rgba(251, 191, 36, 0.5); }

        .tool-bar { display: flex; gap: 25px; margin-top: 20px; border-top: 1px solid var(--border-glass); padding-top: 20px; }
        .tool-link { color: var(--starlight-dim); font-size: 13px; text-decoration: none; cursor: pointer; transition: 0.2s; }
        .tool-link:hover { color: #fff; }

        .btn-next { background: transparent; border: 1px solid var(--starlight-dim); color: var(--starlight); padding: 12px 35px; border-radius: 30px; cursor: pointer; margin-top: 40px; float: right; transition: 0.3s; }
        .btn-next:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.05); }

        /* --- 划线收藏浮窗 --- */
        #highlight-tooltip {
            display: none; position: absolute; z-index: 1000;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-glow));
            color: #fff; padding: 8px 15px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            transform: translate(-50%, -100%); margin-top: -10px;
        }
        #highlight-tooltip::after { content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); border-width: 5px 5px 0; border-style: solid; border-color: var(--accent-glow) transparent transparent transparent; }

        /* --- 划线语料库 Modal --- */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-deep-space); width: 85%; max-width: 700px; max-height: 80vh; border-radius: 16px; border: 1px solid var(--border-glass); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .modal-header { padding: 25px 30px; border-bottom: 1px solid var(--border-glass); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; color: #fff; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .close-modal { background: none; border: none; color: var(--starlight-dim); font-size: 20px; cursor: pointer; }
        .close-modal:hover { color: #fff; }
        .modal-body { padding: 30px; overflow-y: auto; flex-grow: 1; }
        .highlight-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); padding: 20px; border-radius: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .highlight-text { font-family: 'Libre Baskerville', serif; font-size: 18px; color: #fff; line-height: 1.5; }
        .delete-hl { background: none; border: none; color: #ef4444; font-size: 16px; cursor: pointer; opacity: 0.6; transition: 0.2s; }
        .delete-hl:hover { opacity: 1; transform: scale(1.1); }

        .loader { position: fixed; inset: 0; background: var(--bg-deep-space); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; color: var(--starlight-dim); font-size: 13px; }
    </style>
</head>
<body>

<div class="stars-bg"></div>

<div id="loader" class="loader">
    <div style="width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent-glow); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
    <div id="loading-text">正在连接雅思语料库...</div>
</div>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>

<div class="sidebar">
    <div class="brand">
        <h1>雅思口语小助手</h1>
        <p>Cosmic Minimalist Edition</p>
    </div>

    <div class="nav-section">
        <div class="nav-label">Dashboard</div>
        <div class="stats-grid">
            <div class="stat-box">
                <span class="stat-val" id="stat-today">0</span>
                <span class="stat-lab">今日练习</span>
            </div>
            <div class="stat-box">
                <span class="stat-val" id="stat-total">0</span>
                <span class="stat-lab">总题库量</span>
            </div>
        </div>
        
        <button class="btn-random-big" onclick="pickRandom()">
            <i class="fas fa-random"></i> 随机抽题
        </button>
    </div>

    <div class="nav-section">
        <div class="nav-label">Topic Library</div>
        <select id="topic-selector" onchange="changeTopic()">
            <option value="all">混合挑战 (Mixed Topics)</option>
        </select>
    </div>

    <div class="nav-section" style="margin-top: auto;">
        <div class="nav-label">Personal Space</div>
        <button class="btn-ghost" onclick="toggleReviewMode()"><i class="fas fa-book-open"></i> 我的收藏夹 (整题)</button>
        <button class="btn-ghost" onclick="openHighlightsModal()"><i class="fas fa-highlighter"></i> 划线语料库 (句子)</button>
    </div>
</div>

<div class="main-stage">
    <div class="practice-area" id="main-ui" style="display:none;">
        <div class="chinese-prompt" id="cn-sentence"></div>
        
        <textarea id="user-input" placeholder="请阅读中文，在脑中思考或在此试写..."></textarea>
        
        <button class="btn-main" id="check-btn" onclick="showAnswer()">对比地道表达</button>

        <div class="analysis-view" id="answer-section">
            <div class="ref-card">
                <div class="favorite-btn" id="fav-star" onclick="toggleFavorite()"><i class="fas fa-star"></i></div>
                
                <div class="ref-label">NATIVE RE-TRANSLATION</div>
                
                <div class="english-text" id="en-reference"></div>
                
                <div class="target-tags" id="revealed-focus"></div>
                <ul class="insight-list" id="points-list"></ul>

                <div class="tool-bar">
                    <span class="tool-link" onclick="speak('UK')"><i class="fas fa-volume-up"></i> 英音朗读</span>
                    <span class="tool-link" onclick="speak('US')"><i class="fas fa-volume-up"></i> 美音朗读</span>
                    <span class="tool-link" onclick="copyText()"><i class="far fa-copy"></i> 复制整段</span>
                    <span style="flex-grow:1; text-align:right; font-size:11px; color:var(--starlight-dim); opacity:0.6;">*在上方英文中鼠标划线即可收藏好句</span>
                </div>
            </div>
            <button class="btn-next" onclick="nextQuestion()">下一题 →</button>
        </div>
    </div>
</div>

<div id="highlight-tooltip" onclick="saveHighlight()">
    <i class="fas fa-star"></i> 收藏句子
</div>

<div class="modal-overlay" id="highlights-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-highlighter" style="color:var(--accent-glow)"></i> 我的划线语料库</h3>
            <button class="close-modal" onclick="closeHighlightsModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div id="highlights-list"></div>
        </div>
    </div>
</div>

<script>
    const files = [
        'media_sentences.md', 'tech_sentences.md', 'life_sentences.md',
        'work_sentences.md', 'education_sentences.md', 'travel_sentences.md',
        'food_sentences.md', 'transport_sentences.md', 'health_sentences.md',
        'environment_sentences.md', 'government_sentences.md'
    ];

    let allQuestions = [];
    let currentQuestions = [];
    let currentIndex = 0;
    let favorites = JSON.parse(localStorage.getItem('ielts_favs') || '[]');
    let highlights = JSON.parse(localStorage.getItem('ielts_highlights') || '[]');
    let reviewMode = false;

    function generateId(str) {
        return encodeURIComponent(str).replace(/%/g, '').substring(0, 20);
    }

    async function init() {
        for (const file of files) {
            try {
                const res = await fetch(file);
                if (!res.ok) continue;
                const text = await res.text();
                const sections = text.split(/##\s+[A-Za-z0-9_]+/).slice(1);
                
                sections.forEach(sec => {
                    if (sec.includes('使用的表达覆盖')) return;
                    try {
                        const cnMatch = sec.match(/\*\*中文\*\*([\s\S]*?)\*\*话题\*\*/);
                        if (!cnMatch) return;
                        const cn = cnMatch[1].trim().replace(/^[:：\s]+/, '');

                        const topicMatch = sec.match(/\*\*话题\*\*([\s\S]*?)\*\*练习重点\*\*/);
                        const topic = topicMatch[1].trim().replace(/^[:：\s]+/, '').replace(/\(.*\)/, "").trim(); 
                        
                        const focusMatch = sec.match(/\*\*练习重点\*\*([\s\S]*?)\*\*英文参考/);
                        const focus = focusMatch[1].trim().replace(/^[:：\s]+/, '');

                        const enMatch = sec.match(/\*\*英文参考\(口语\)\*\*([\s\S]*?)\*\*学习要点\*\*/);
                        const en = enMatch[1].trim().replace(/^[:：\s]+/, '');

                        const ptsPart = sec.split(/\*\*学习要点\*\*/)[1].split('---')[0].trim();
                        const points = ptsPart.split('\n').filter(l => l.trim().match(/^\d+\./)).map(l => l.replace(/^\d+\.\s*/, '').trim());
                        
                        allQuestions.push({ id: generateId(cn), cn, topic, focus, en, points });
                    } catch(e) {}
                });
            } catch(e) {}
        }

        if (allQuestions.length === 0) {
            document.getElementById('loader').innerHTML = "<div style='color:#ef4444; text-align:center;'><i class='fas fa-exclamation-circle fa-2x' style='margin-bottom:15px'></i><br>语料加载失败<br><br><span style='color:var(--starlight-dim); font-size:12px;'>请确认是否使用真实网址访问</span></div>";
            return;
        }

        document.getElementById('stat-total').innerText = allQuestions.length;
        updateDailyStats();

        const topics = [...new Set(allQuestions.map(q => q.topic))];
        const selector = document.getElementById('topic-selector');
        topics.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t; opt.innerText = t; selector.appendChild(opt);
        });

        document.getElementById('loader').style.display = 'none';
        document.getElementById('main-ui').style.display = 'block';
        changeTopic();
    }

    function changeTopic() {
        reviewMode = false;
        const t = document.getElementById('topic-selector').value;
        currentQuestions = (t === 'all') ? [...allQuestions].sort(() => Math.random() - 0.5) : allQuestions.filter(q => q.topic === t);
        currentIndex = 0;
        render();
    }

    function toggleReviewMode() {
        if (favorites.length === 0) { alert("整题收藏夹是空的哦！在练习时点击右侧的⭐即可收藏。"); return; }
        reviewMode = true;
        currentQuestions = allQuestions.filter(q => favorites.includes(q.id));
        currentIndex = 0;
        document.getElementById('topic-selector').value = 'all';
        render();
    }

    function render() {
        if (currentQuestions.length === 0) return;
        const q = currentQuestions[currentIndex];
        document.getElementById("cn-sentence").innerText = q.cn;
        document.getElementById("en-reference").innerText = q.en;
        document.getElementById("revealed-focus").innerText = "🎯 考点追踪: " + q.focus;
        
        const list = document.getElementById("points-list");
        list.innerHTML = "";
        q.points.forEach(p => {
            const li = document.createElement("li");
            li.innerHTML = p.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            list.appendChild(li);
        });

        const star = document.getElementById('fav-star');
        star.className = favorites.includes(q.id) ? 'favorite-btn active' : 'favorite-btn';

        document.getElementById("user-input").value = "";
        document.getElementById("answer-section").style.display = "none";
        document.getElementById("check-btn").style.display = "block";
    }

    function showAnswer() {
        document.getElementById("answer-section").style.display = "block";
        document.getElementById("check-btn").style.display = "none";
        incrementDaily();
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex >= currentQuestions.length) {
            alert(reviewMode ? "收藏夹复习完毕！" : "本组挑战完成！");
            currentIndex = 0;
        }
        render();
    }

    function pickRandom() {
        reviewMode = false;
        currentIndex = Math.floor(Math.random() * allQuestions.length);
        currentQuestions = [allQuestions[currentIndex]];
        currentIndex = 0;
        document.getElementById('topic-selector').value = 'all';
        render();
    }

    // Bug已修复：不再调用 render()，只切换样式和存入本地
    function toggleFavorite() {
        const q = currentQuestions[currentIndex];
        const star = document.getElementById('fav-star');
        if (favorites.includes(q.id)) {
            favorites = favorites.filter(id => id !== q.id); 
            star.className = 'favorite-btn';
        } else {
            favorites.push(q.id);
            star.className = 'favorite-btn active';
        }
        localStorage.setItem('ielts_favs', JSON.stringify(favorites));
    }

    // ====== 划线收藏功能核心逻辑 ======
    document.addEventListener('mouseup', function() {
        const sel = window.getSelection();
        const tooltip = document.getElementById('highlight-tooltip');

        if (!sel.isCollapsed && sel.toString().trim().length > 0) {
            const range = sel.getRangeAt(0);
            const enRef = document.getElementById('en-reference');

            // 确保划线的部分是在英文答案框内
            if (enRef.contains(range.commonAncestorContainer) || enRef === range.commonAncestorContainer) {
                const rect = range.getBoundingClientRect();
                tooltip.style.display = 'flex';
                tooltip.style.left = (rect.left + rect.width / 2) + 'px'; 
                tooltip.style.top = (rect.top + window.scrollY) + 'px'; 
                return;
            }
        }
        tooltip.style.display = 'none';
    });

    function saveHighlight() {
        const text = window.getSelection().toString().trim();
        const tooltip = document.getElementById('highlight-tooltip');
        if(text && !highlights.includes(text)) {
            highlights.unshift(text); // 存入最新
            localStorage.setItem('ielts_highlights', JSON.stringify(highlights));
            tooltip.innerHTML = '<i class="fas fa-check"></i> 收藏成功';
            setTimeout(() => {
                tooltip.style.display = 'none';
                tooltip.innerHTML = '<i class="fas fa-star"></i> 收藏句子';
                window.getSelection().removeAllRanges();
            }, 1000);
        } else if (highlights.includes(text)) {
            alert("这条语料已经在你的库里啦！");
            tooltip.style.display = 'none';
            window.getSelection().removeAllRanges();
        }
    }

    function openHighlightsModal() {
        const container = document.getElementById('highlights-list');
        container.innerHTML = '';
        if(highlights.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:var(--starlight-dim); padding:40px;">暂无划线收藏。在解析中用鼠标选中文本即可收藏好词好句。</div>';
        } else {
            highlights.forEach((h, idx) => {
                container.innerHTML += `
                    <div class="highlight-item">
                        <div class="highlight-text">${h}</div>
                        <button class="delete-hl" onclick="deleteHighlight(${idx})" title="删除"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });
        }
        document.getElementById('highlights-modal').style.display = 'flex';
    }

    function closeHighlightsModal() { document.getElementById('highlights-modal').style.display = 'none'; }

    function deleteHighlight(index) {
        highlights.splice(index, 1);
        localStorage.setItem('ielts_highlights', JSON.stringify(highlights));
        openHighlightsModal();
    }

    // ==================================

    function updateDailyStats() {
        const today = new Date().toLocaleDateString();
        if (localStorage.getItem('ielts_date') !== today) {
            localStorage.setItem('ielts_date', today);
            localStorage.setItem('ielts_count', '0');
        }
        document.getElementById('stat-today').innerText = localStorage.getItem('ielts_count');
    }

    function incrementDaily() {
        let count = parseInt(localStorage.getItem('ielts_count') || '0');
        count++;
        localStorage.setItem('ielts_count', count.toString());
        document.getElementById('stat-today').innerText = count;
    }

    function speak(accent) {
        if (!('speechSynthesis' in window)) { alert("浏览器不支持语音"); return; }
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(document.getElementById("en-reference").innerText);
        msg.lang = accent === 'UK' ? 'en-GB' : 'en-US';
        msg.rate = 0.85;
        window.speechSynthesis.speak(msg);
    }

    function copyText() {
        navigator.clipboard.writeText(document.getElementById("en-reference").innerText);
        alert("整句语料已复制");
    }

    window.onload = init;
</script>

</body>
</html>
