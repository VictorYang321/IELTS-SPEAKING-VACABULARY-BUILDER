<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅思口语小助手 | Geek Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 极客风配色方案 */
            --sidebar-bg: #09090b;
            --main-bg: #18181b;
            --accent: #06b6d4; /* 赛博青 */
            --accent-glow: rgba(6, 182, 212, 0.4);
            --success: #10b981;
            --text-main: #f4f4f5;
            --text-dim: #a1a1aa;
            --panel-border: rgba(255, 255, 255, 0.08);
            --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--main-bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 左侧侧边栏 (控制台) --- */
        .sidebar {
            width: 300px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            padding: 35px 25px;
            box-sizing: border-box;
            z-index: 10;
        }

        .brand h1 {
            font-size: 20px;
            margin: 0;
            color: var(--accent);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .brand p {
            font-size: 12px;
            color: var(--text-dim);
            margin: 8px 0 40px 0;
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        .nav-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 12px;
        }

        select {
            width: 100%;
            padding: 12px;
            background: #27272a;
            border: 1px solid var(--panel-border);
            color: white;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            margin-bottom: 30px;
            font-size: 14px;
        }

        select:focus {
            border-color: var(--accent);
        }

        .btn-sidebar {
            width: 100%;
            text-align: left;
            background: transparent;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .btn-sidebar i {
            color: var(--accent);
            margin-right: 12px;
            width: 16px;
        }

        .btn-sidebar:hover {
            background: var(--glass);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* --- 右侧主练习区 --- */
        .main-stage {
            flex-grow: 1;
            background: radial-gradient(circle at center, #18181b 0%, #09090b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 40px;
            overflow-y: auto;
        }

        .content-container {
            max-width: 760px;
            width: 100%;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            font-family: monospace;
            color: var(--accent);
            font-size: 14px;
            border-bottom: 1px dashed var(--panel-border);
            padding-bottom: 10px;
        }

        .practice-card {
            background: #18181b;
            border: 1px solid var(--panel-border);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .chinese-prompt {
            font-size: 22px;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 30px;
            color: var(--text-main);
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #09090b;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 15px;
            color: var(--accent);
            font-size: 16px;
            font-family: monospace;
            resize: none;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: inset 0 0 10px var(--accent-glow);
        }

        .btn-primary {
            width: 100%;
            background: var(--accent);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-primary:hover {
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-1px);
        }

        /* --- 解析区域 --- */
        .analytics {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ref-answer-box {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            position: relative;
        }

        .ref-tools {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
        }

        .tool-btn {
            background: #27272a;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tool-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .english-text {
            font-size: 20px;
            font-weight: 600;
            color: var(--success);
            line-height: 1.5;
            margin-top: 15px;
        }

        .insight-section h5 {
            color: var(--text-dim);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 25px 0 15px 0;
            display: flex;
            align-items: center;
        }

        .insight-section h5 i {
            color: var(--accent);
            margin-right: 8px;
        }

        #revealed-focus {
            font-size: 14px;
            color: var(--accent);
            background: rgba(6, 182, 212, 0.1);
            padding: 12px 15px;
            border-radius: 6px;
            border-left: 3px solid var(--accent);
            margin-bottom: 25px;
        }

        .insight-list { padding: 0; margin: 0; list-style: none; }

        .insight-list li {
            padding: 15px;
            background: #18181b;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.5;
        }

        .insight-list li b { color: var(--text-main); }

        .loader { position: fixed; inset: 0; background: var(--sidebar-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; color: var(--accent); font-family: monospace; }
    </style>
</head>
<body>

<div id="loader" class="loader">
    <i class="fas fa-terminal fa-2x" style="margin-bottom:15px"></i>
    <div>INITIALIZING DATABASE...</div>
</div>

<div class="sidebar">
    <div class="brand">
        <h1>雅思口语小助手</h1>
        <p>> v1.0.0_geek_edition</p>
    </div>

    <div style="flex-grow: 1;">
        <div class="nav-label">MODULE_SELECT</div>
        <select id="topic-selector" onchange="changeTopic()">
            <option value="all">ALL_TOPICS_MIXED</option>
        </select>
        
        <div class="nav-label" style="margin-top:30px">SYSTEM_CONTROLS</div>
        <button class="btn-sidebar" onclick="pickRandom()">
            <i class="fas fa-dice"></i> 随机抽题 (Random)
        </button>
        <div style="height: 50px;"></div> 
    </div>
</div>

<div class="main-stage">
    <div class="content-container" id="main-ui" style="display:none;">
        <div class="stats-bar">
            <span id="topic-display">[ TOPIC_LOADING ]</span>
            <span id="progress-display">SEQ: 00/00</span>
        </div>

        <div class="practice-card">
            <div class="chinese-prompt" id="cn-sentence"></div>
            
            <textarea id="user-input" placeholder="> Enter your translation here..."></textarea>
            
            <button class="btn-primary" id="check-btn" onclick="showAnswer()">DECRYPT NATIVE EXPRESSION</button>
        </div>

        <div class="analytics" id="answer-section">
            <div class="ref-answer-box">
                <div class="ref-tools">
                    <button class="tool-btn" onclick="speakRef('UK')" title="英式发音"><i class="fas fa-volume-up"></i> 🇬🇧 UK</button>
                    <button class="tool-btn" onclick="speakRef('US')" title="美式发音"><i class="fas fa-volume-up"></i> 🇺🇸 US</button>
                    <button class="tool-btn" onclick="copyRef()" title="复制句型"><i class="far fa-copy"></i> Copy</button>
                </div>
                <div style="font-size:12px; color:var(--success); font-family:monospace; margin-bottom:5px;">// STANDARD_REFERENCE</div>
                <div class="english-text" id="en-reference"></div>
            </div>

            <div class="insight-section">
                <h5><i class="fas fa-crosshairs"></i> TARGET_EXPRESSIONS</h5>
                <div id="revealed-focus"></div>

                <h5><i class="fas fa-code-branch"></i> LINGUISTIC_BREAKDOWN</h5>
                <ul class="insight-list" id="points-list"></ul>
            </div>

            <button class="btn-sidebar" style="justify-content:center; margin-top:30px; font-weight:bold; border-color:var(--success); color:var(--success)" onclick="nextQuestion()">
                EXECUTE NEXT ➔
            </button>
        </div>
    </div>
</div>

<script>
    const files = [
        'media_sentences.md', 'tech_sentences.md', 'life_sentences.md',
        'work_sentences.md', 'education_sentences.md', 'travel_sentences.md',
        'food_sentences.md', 'transport_sentences.md', 'health_sentences.md',
        'environment_sentences.md', 'government_sentences.md'
    ];

    let allQuestions = [];
    let currentQuestions = [];
    let currentIndex = 0;

    async function init() {
        for (const file of files) {
            try {
                const res = await fetch(file);
                if (!res.ok) continue;
                const text = await res.text();
                const sections = text.split(/##\s+/).slice(1);
                
                sections.forEach(sec => {
                    if (sec.includes('使用的表达覆盖')) return;
                    try {
                        const cn = sec.match(/\*\*中文\*\*\s*([\s\S]*?)\n/)[1].trim();
                        const topic = sec.match(/\*\*话题\*\*\s*[:：]\s*(.*?)\n/)[1].trim();
                        const focus = sec.match(/\*\*练习重点\*\*\s*[:：]\s*(.*?)\n/)[1].trim();
                        const en = sec.match(/\*\*英文参考\(口语\)\*\*\s*([\s\S]*?)\n\n/)[1].trim();
                        const ptsPart = sec.split(/\*\*学习要点\*\*/)[1].split('---')[0].trim();
                        const points = ptsPart.split('\n').filter(l => l.trim().match(/^\d+\./)).map(l => l.replace(/^\d+\.\s*/, '').trim());
                        allQuestions.push({ cn, topic, focus, en, points });
                    } catch(e) {}
                });
            } catch(e) {}
        }

        const topics = [...new Set(allQuestions.map(q => q.topic))];
        const selector = document.getElementById('topic-selector');
        topics.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t;
            opt.innerText = t;
            selector.appendChild(opt);
        });

        document.getElementById('loader').style.display = 'none';
        document.getElementById('main-ui').style.display = 'block';
        changeTopic();
    }

    function changeTopic() {
        const t = document.getElementById('topic-selector').value;
        currentQuestions = (t === 'all') ? [...allQuestions].sort(() => Math.random() - 0.5) : allQuestions.filter(q => q.topic === t);
        currentIndex = 0;
        render();
    }

    function pickRandom() {
        const randomIndex = Math.floor(Math.random() * allQuestions.length);
        currentQuestions = [allQuestions[randomIndex]];
        currentIndex = 0;
        document.getElementById('topic-selector').value = 'all'; // Reset selector visually
        render();
        // Give a visual cue that it's a random pull
        document.getElementById("topic-display").innerText = `[ RANDOM: ${currentQuestions[0].topic} ]`;
        document.getElementById('progress-display').innerText = `SEQ: RND/RND`;
    }

    function render() {
        const q = currentQuestions[currentIndex];
        // Only update progress normally if not in random mode
        if (document.getElementById('progress-display').innerText !== `SEQ: RND/RND`) {
            document.getElementById('progress-display').innerText = `SEQ: ${(currentIndex + 1).toString().padStart(2, '0')}/${currentQuestions.length.toString().padStart(2, '0')}`;
            document.getElementById("topic-display").innerText = `[ ${q.topic} ]`;
        }
        
        document.getElementById("cn-sentence").innerText = q.cn;
        document.getElementById("revealed-focus").innerHTML = q.focus;
        document.getElementById("en-reference").innerText = q.en;
        
        const list = document.getElementById("points-list");
        list.innerHTML = "";
        q.points.forEach(p => {
            const li = document.createElement("li");
            li.innerHTML = p.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            list.appendChild(li);
        });

        document.getElementById("user-input").value = "";
        document.getElementById("answer-section").style.display = "none";
        document.getElementById("check-btn").style.display = "block";
        document.querySelector('.main-stage').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showAnswer() {
        document.getElementById("answer-section").style.display = "block";
        document.getElementById("check-btn").style.display = "none";
        setTimeout(() => {
            document.querySelector('.main-stage').scrollTo({ top: 600, behavior: 'smooth' });
        }, 100);
    }

    function nextQuestion() {
        if (document.getElementById('progress-display').innerText === `SEQ: RND/RND`) {
            // If in random mode, just pull another random question
            pickRandom();
            return;
        }

        currentIndex++;
        if (currentIndex >= currentQuestions.length) {
            alert("SYSTEM NOTIFICATION: Module Completed.");
            currentIndex = 0;
        }
        render();
    }

    // TTS 发音引擎
    function speakRef(accent) {
        const text = document.getElementById("en-reference").innerText;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // 停止当前正在播放的语音
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = accent === 'UK' ? 'en-GB' : 'en-US';
            msg.rate = 0.9; // 稍微放慢语速以便模仿
            window.speechSynthesis.speak(msg);
        } else {
            alert("抱歉，您的浏览器不支持语音朗读功能。");
        }
    }

    // 一键复制
    function copyRef() {
        const text = document.getElementById("en-reference").innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.fa-copy').parentElement;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            btn.style.color = 'var(--success)';
            btn.style.borderColor = 'var(--success)';
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.color = '';
                btn.style.borderColor = '';
            }, 2000);
        });
    }

    init();
</script>

</body>
</html>
