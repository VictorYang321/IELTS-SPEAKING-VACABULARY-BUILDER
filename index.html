<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅思口语小助手 | Obsidian Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #050505;
            --card-gray: #111111;
            --border-light: rgba(255, 255, 255, 0.08);
            --accent-gold: #c5a059; /* 哑金点缀，提升高级感 */
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-black);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 侧边栏：极简布局 --- */
        .sidebar {
            width: 280px;
            background: var(--bg-black);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            padding: 40px 24px;
            box-sizing: border-box;
        }

        .brand h1 {
            font-size: 18px;
            margin: 0;
            letter-spacing: 1px;
            color: #fff;
        }

        .brand p {
            font-size: 11px;
            color: var(--text-muted);
            margin: 8px 0 40px 0;
            line-height: 1.4;
        }

        .nav-section { margin-bottom: 35px; }
        .nav-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-gold);
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* 数据看板 */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }
        .stat-box {
            background: var(--card-gray);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
        }
        .stat-val { font-size: 18px; font-weight: 600; color: #fff; display: block; }
        .stat-lab { font-size: 9px; color: var(--text-muted); margin-top: 4px; }

        select {
            width: 100%;
            padding: 10px;
            background: var(--card-gray);
            border: 1px solid var(--border-light);
            color: #fff;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .btn-ghost {
            width: 100%;
            text-align: left;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 10px 0;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
        }
        .btn-ghost i { width: 20px; color: var(--accent-gold); margin-right: 10px; font-size: 14px; }
        .btn-ghost:hover { color: #fff; }

        /* --- 主内容区：全屏沉浸 --- */
        .main-stage {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 40px;
            overflow-y: auto;
        }

        .practice-area {
            max-width: 800px;
            width: 100%;
        }

        .chinese-prompt {
            font-size: 24px;
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #fff;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 160px;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-main);
            font-size: 18px;
            font-family: inherit;
            resize: none;
            padding: 20px 0;
            margin-bottom: 20px;
            transition: border-color 0.4s;
        }
        textarea:focus { outline: none; border-bottom-color: var(--accent-gold); }

        .btn-main {
            background: white;
            color: black;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: block;
            margin: 20px auto;
            transition: 0.3s;
        }
        .btn-main:hover { opacity: 0.8; transform: scale(1.02); }

        /* --- 答案解析：质感重构 --- */
        .analysis-view {
            display: none;
            margin-top: 60px;
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .ref-card {
            background: var(--card-gray);
            border: 1px solid var(--border-light);
            padding: 40px;
            border-radius: 12px;
            position: relative;
        }

        .ref-label {
            font-size: 10px;
            color: var(--accent-gold);
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .english-text {
            font-family: 'Libre Baskerville', serif;
            font-size: 22px;
            line-height: 1.7;
            color: #fff;
            margin-bottom: 30px;
            font-style: italic;
        }

        .target-tags {
            font-size: 13px;
            color: var(--accent-gold);
            border-left: 2px solid var(--accent-gold);
            padding-left: 15px;
            margin-bottom: 40px;
        }

        .insight-list { list-style: none; padding: 0; }
        .insight-list li {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 18px;
            line-height: 1.6;
        }
        .insight-list li b { color: var(--text-main); font-weight: 600; }

        .favorite-btn {
            position: absolute;
            top: 40px;
            right: 40px;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-muted);
            transition: 0.2s;
        }
        .favorite-btn:hover { color: #fff; }
        .favorite-btn.active { color: var(--accent-gold); }

        .tool-bar { display: flex; gap: 20px; margin-top: 10px; }
        .tool-link { color: var(--text-muted); font-size: 12px; text-decoration: none; cursor: pointer; }
        .tool-link:hover { color: #fff; }
