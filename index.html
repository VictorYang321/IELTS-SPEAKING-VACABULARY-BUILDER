<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Speaking Vocabulary Builder | Tech Edition</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --success-color: #22c55e;
            --border-glow: rgba(56, 189, 248, 0.2);
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), 0 0 1px 1px var(--border-glow);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            letter-spacing: -0.5px;
            color: var(--accent-color);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(15, 23, 42, 0.5);
            padding: 15px;
            border-radius: 12px;
        }

        select {
            flex-grow: 1;
            padding: 10px;
            background: #334155;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }

        .progress {
            font-family: 'Courier New', monospace;
            color: var(--accent-color);
            font-weight: bold;
        }

        .question-box {
            margin-bottom: 30px;
        }

        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid var(--accent-color);
            margin-bottom: 20px;
            display: inline-block;
        }

        .chinese-sentence {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 10px;
            font-size: 17px;
            resize: none;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .answer-section {
            display: none;
            margin-top: 35px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 重点解析在点击后才出现 */
        .revealed-focus {
            font-size: 14px;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 4px solid #fbbf24;
            margin-bottom: 20px;
        }

        .english-reference {
            font-size: 19px;
            font-weight: 600;
            color: var(--success-color);
            background: rgba(34, 197, 94, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .learning-points h3 {
            font-size: 16px;
            color: var(--accent-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .learning-points ul {
            padding-left: 18px;
            color: var(--text-secondary);
        }

        .learning-points li {
            margin-bottom: 12px;
            font-size: 15px;
        }

        .btn-next {
            background: transparent;
            border: 2px solid var(--success-color);
            color: var(--success-color);
        }

        .btn-next:hover {
            background: var(--success-color);
            color: white;
        }

        .loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
    </style>
</head>
<body>

<div id="loader" class="loading-screen">SYSTEM INITIALIZING...</div>

<div class="container" id="main-ui" style="display:none;">
    <div class="header">
        <h1>IELTS RE-TRANSLATION</h1>
        <p>Refining Vocabulary & Grammatical Texture</p>
    </div>

    <div class="controls">
        <select id="topic-selector" onchange="changeTopic()">
            <option value="all">ALL TOPICS</option>
        </select>
        <div class="progress" id="progress">00 / 00</div>
    </div>

    <div class="question-box">
        <div class="badge" id="topic-badge">TOPIC</div>
        <div class="chinese-sentence" id="cn-sentence"></div>
        
        <textarea id="user-input" placeholder="Think, translate, then verify..."></textarea>
        
        <button class="btn" id="check-btn" onclick="showAnswer()">REVEAL ANALYTICS</button>
    </div>

    <div class="answer-section" id="answer-section">
        <div class="revealed-focus" id="revealed-focus"></div>
        
        <div class="english-reference" id="en-reference"></div>
        
        <div class="learning-points">
            <h3><span>//</span> LINGUISTIC INSIGHTS</h3>
            <ul id="points-list"></ul>
        </div>
        <button class="btn btn-next" onclick="nextQuestion()">NEXT CHALLENGE ➔</button>
    </div>
</div>

<script>
    const files = [
        'media_sentences.md', 'tech_sentences.md', 'life_sentences.md',
        'work_sentences.md', 'education_sentences.md', 'travel_sentences.md',
        'food_sentences.md', 'transport_sentences.md', 'health_sentences.md',
        'environment_sentences.md', 'government_sentences.md'
    ];

    let allQuestions = [];
    let currentQuestions = [];
    let currentIndex = 0;

    async function init() {
        for (const file of files) {
            try {
                const res = await fetch(file);
                if (!res.ok) continue;
                const text = await res.text();
                
                // 更加健壮的分割逻辑，支持中文标题和不同格式
                const sections = text.split(/##\s+/).slice(1);
                
                sections.forEach(sec => {
                    if (sec.includes('使用的表达覆盖')) return;
                    try {
                        const cn = sec.match(/\*\*中文\*\*\s*([\s\S]*?)\n/)[1].trim();
                        const topic = sec.match(/\*\*话题\*\*\s*[:：]\s*(.*?)\n/)[1].trim();
                        const focus = sec.match(/\*\*练习重点\*\*\s*[:：]\s*(.*?)\n/)[1].trim();
                        const en = sec.match(/\*\*英文参考\(口语\)\*\*\s*([\s\S]*?)\n\n/)[1].trim();
                        
                        const pointsPart = sec.split(/\*\*学习要点\*\*/)[1].split('---')[0].trim();
                        const points = pointsPart.split('\n')
                            .filter(l => l.trim().match(/^\d+\./))
                            .map(l => l.replace(/^\d+\.\s*/, '').trim());

                        allQuestions.push({ cn, topic, focus, en, points });
                    } catch(e) { /* skip broken blocks */ }
                });
            } catch(e) {}
        }

        const topics = [...new Set(allQuestions.map(q => q.topic))];
        const selector = document.getElementById('topic-selector');
        topics.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t;
            opt.innerText = t.toUpperCase();
            selector.appendChild(opt);
        });

        document.getElementById('loader').style.display = 'none';
        document.getElementById('main-ui').style.display = 'block';
        changeTopic();
    }

    function changeTopic() {
        const t = document.getElementById('topic-selector').value;
        currentQuestions = (t === 'all') 
            ? [...allQuestions].sort(() => Math.random() - 0.5)
            : allQuestions.filter(q => q.topic === t);
        currentIndex = 0;
        render();
    }

    function render() {
        const q = currentQuestions[currentIndex];
        document.getElementById('progress').innerText = 
            String(currentIndex + 1).padStart(2, '0') + " / " + String(currentQuestions.length).padStart(2, '0');
        document.getElementById("topic-badge").innerText = q.topic;
        document.getElementById("cn-sentence").innerText = q.cn;
        
        // 渲染解析区的内容，但先隐藏
        document.getElementById("revealed-focus").innerHTML = "⚡ <b>EXPRESSION TARGETS:</b> " + q.focus;
        document.getElementById("en-reference").innerText = q.en;
        
        const list = document.getElementById("points-list");
        list.innerHTML = "";
        q.points.forEach(p => {
            const li = document.createElement("li");
            li.innerHTML = p.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            list.appendChild(li);
        });

        document.getElementById("user-input").value = "";
        document.getElementById("answer-section").style.display = "none";
        document.getElementById("check-btn").style.display = "block";
    }

    function showAnswer() {
        document.getElementById("answer-section").style.display = "block";
        document.getElementById("check-btn").style.display = "none";
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex >= currentQuestions.length) {
            alert("TOPIC COMPLETED!");
            currentIndex = 0;
        }
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    init();
</script>

</body>
</html>
